name: Build LG_FrameGen Matrix
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Building for all UE5 versions using modern cloud actions
        ue_version: ["5.0", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6"]

    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Unreal Engine Plugin
        # Switching to a modern action that is v4/v5 cache compliant
        uses: unreal-actions/build-plugin@v0
        with:
          version: ${{ matrix.ue_version }}
          uplugin-path: ./LG_FrameGenHelper.uplugin

      - name: Upload Finished Plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG_FrameGen_UE${{ matrix.ue_version }}
          path: |
            Binaries/
            Source/
            Resources/
            *.uplugin
