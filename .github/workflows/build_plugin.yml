name: Build LG_FrameGen for UE5
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false  # Important: If 5.1 fails, 5.4 keeps going!
      matrix:
        # We'll stick to the most stable ones first to confirm it works
        ue_version: ["5.3", "5.4", "5.5"] 

    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Unreal Engine Plugin
        # Using the Unreal-Actions suite which is the current industry standard for this
        uses: unreal-actions/build-plugin@v0
        with:
          version: ${{ matrix.ue_version }}
          # Since your uplugin is in the root, we just provide the name
          uplugin-path: ./LG_FrameGenHelper.uplugin

      - name: Upload Build Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG_FrameGen_UE${{ matrix.ue_version }}
          path: |
            Binaries/
            Source/
            Resources/
            *.uplugin
