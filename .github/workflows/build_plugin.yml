name: Build LG_FrameGen for UE5
on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false  # CRITICAL: Keeps 5.4 building even if 5.1/5.7 fail
      matrix:
        # We will build 5.0 through 5.6 first. 
        # 5.7 is excluded here for stability; we can add it once these pass.
        ue_version: ["5.0", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6"]

    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Plugin
        # Using a highly-rated community action for reliable UAT execution
        uses: jreiff/unreal-action@v1
        with:
          version: ${{ matrix.ue_version }}
          operation: build-plugin
          # Path is just the filename since it's in the root
          uplugin_path: "LG_FrameGenHelper.uplugin" 

      - name: Upload Finished Plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG_FrameGen_UE${{ matrix.ue_version }}
          path: |
            Binaries/
            Source/
            Resources/
            *.uplugin
