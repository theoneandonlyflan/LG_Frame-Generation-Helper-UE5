name: Build LG_FrameGen Matrix
on: [push, workflow_dispatch]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Building for every UE5 version in the cloud
        ue_version: ["5.0", "5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7"]
    
    runs-on: windows-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Plugin
        # We use @main here to match the current default branch
        uses: Guganana/UnrealCodeBuilder@main 
        with:
          version: ${{ matrix.ue_version }}
          uplugin_path: "LG_FrameGenHelper.uplugin"

      - name: Upload Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LG_FrameGen_UE${{ matrix.ue_version }}
          path: |
             Binaries/
             Source/
             Resources/
             *.uplugin
